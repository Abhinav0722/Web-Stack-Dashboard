<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Implants Comparison</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #f3f4f6;
            --bg-panel: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --uhc-blue: #0284c7;
            --uhc-light-blue: #38bdf8;
            --positive: #16a34a;
            --negative: #dc2626;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        body { font-family: 'Inter', system-ui, sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 24px; }

        /* Global Header */
        .header-bar { background: var(--bg-panel); padding: 16px 24px; border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); }
        .header-titles h2 { margin: 0; color: var(--uhc-blue); font-size: 1.6em; letter-spacing: -0.5px; text-transform: uppercase; }

        /* Dashboard Module Layout */
        .module-container { padding: 24px; background: #e2e8f0; border-radius: 16px; margin-bottom: 32px; border: 1px solid #94a3b8; }
        .dashboard-grid { display: grid; grid-template-columns: 3fr 1fr; gap: 24px; }
        
        .panel { background: var(--bg-panel); padding: 24px; border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        .panel-header-row { display: flex; justify-content: center; align-items: center; margin-bottom: 24px; border-bottom: 2px solid var(--border-color); padding-bottom: 12px;}
        .panel-title { font-size: 1.4em; color: var(--uhc-blue); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin: 0; }

        /* Sidebar Filters */
        .sidebar { background: var(--bg-panel); padding: 24px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 20px; }
        .filter-group { display: flex; flex-direction: column; gap: 8px; }
        .filter-group label { font-size: 0.85em; font-weight: 700; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
        select { padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.9em; outline: none; font-family: inherit; background: #f8fafc; }
        select:focus { border-color: var(--uhc-blue); }

        /* Funnel CSS */
        .funnel-wrapper { display: flex; flex-direction: column; gap: 12px; padding: 0 10px; }
        .funnel-row { display: flex; align-items: center; width: 100%; gap: 16px; }
        .funnel-label { width: 100px; font-weight: 700; font-size: 0.9em; color: var(--text-main); text-transform: uppercase; text-align: left; }
        
        .funnel-bar-container { flex: 1; display: flex; justify-content: center; align-items: center; background: #f1f5f9; height: 36px; border-radius: 4px; position: relative; }
        .funnel-bar { height: 100%; display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; font-size: 1.1em; border-radius: 4px; transition: width 0.5s ease-out; min-width: 80px; white-space: nowrap; }
        
        .funnel-delta { width: 90px; font-size: 0.9em; font-weight: 700; text-align: right; }
        
        /* Funnel Colors */
        .bar-inflow { background: linear-gradient(90deg, #0284c7, #38bdf8); }
        .bar-inscope { background: linear-gradient(90deg, #2563eb, #60a5fa); }
        .bar-selected { background: linear-gradient(90deg, #7c3aed, #a78bfa); }
        .bar-approved { background: linear-gradient(90deg, #ea580c, #fb923c); }

        /* Print Optimization */
        @media print {
            @page { size: letter portrait; margin: 5mm; }
            body { background: white; padding: 0; margin: 0; zoom: 0.9; }
            .header-bar { justify-content: center; margin-bottom: 15px; }
            .file-upload, .sidebar { display: none !important; }
            .module-container { padding: 0; background: transparent; border: none; margin-bottom: 20px; }
            .dashboard-grid { grid-template-columns: 1fr; display: block; }
            .panel { box-shadow: none !important; border: 1px solid var(--border-color) !important; padding: 20px !important; page-break-inside: avoid; }
            * { -webkit-print-color-adjust: exact !important; color-adjust: exact !important; }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="header-titles">
            <h2>IMPLANTS COMPARISON</h2>
        </div>
        <div class="file-upload">
            <input type="file" id="csvFileInput" accept=".csv" style="font-family: inherit;">
        </div>
    </div>

    <div class="module-container" id="module-1">
        <div class="dashboard-grid">
            <div class="main-content">
                <div class="panel">
                    <div class="panel-header-row">
                        <h3 class="panel-title" id="title-1">SELECT CLIENT IMPLANTS</h3>
                    </div>
                    
                    <div class="funnel-wrapper">
                        <div class="funnel-row">
                            <div class="funnel-label">Inflow</div>
                            <div class="funnel-bar-container"><div id="bar-inflow-1" class="funnel-bar bar-inflow" style="width: 0%"><span id="val-inflow-1">--</span></div></div>
                            <div class="funnel-delta" id="delta-inflow-1"></div>
                        </div>
                        <div class="funnel-row">
                            <div class="funnel-label">Inscope</div>
                            <div class="funnel-bar-container"><div id="bar-inscope-1" class="funnel-bar bar-inscope" style="width: 0%"><span id="val-inscope-1">--</span></div></div>
                            <div class="funnel-delta" id="delta-inscope-1"></div>
                        </div>
                        <div class="funnel-row">
                            <div class="funnel-label">Selected</div>
                            <div class="funnel-bar-container"><div id="bar-selected-1" class="funnel-bar bar-selected" style="width: 0%"><span id="val-selected-1">--</span></div></div>
                            <div class="funnel-delta" id="delta-selected-1"></div>
                        </div>
                        <div class="funnel-row">
                            <div class="funnel-label">Approved</div>
                            <div class="funnel-bar-container"><div id="bar-approved-1" class="funnel-bar bar-approved" style="width: 0%"><span id="val-approved-1">--</span></div></div>
                            <div class="funnel-delta" id="delta-approved-1"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="sidebar">
                <div class="filter-group">
                    <label>Client (Module 1)</label>
                    <select id="filter-client-1"><option value="">Load Data First...</option></select>
                </div>
                <div class="filter-group">
                    <label>Selection Type</label>
                    <select id="filter-sel-1"></select>
                </div>
                <div class="filter-group">
                    <label>Month Run</label>
                    <select id="filter-month-1"></select>
                </div>
            </div>
        </div>
    </div>

    <div class="module-container" id="module-2">
        <div class="dashboard-grid">
            <div class="main-content">
                <div class="panel">
                    <div class="panel-header-row">
                        <h3 class="panel-title" id="title-2">SELECT CLIENT IMPLANTS</h3>
                    </div>
                    
                    <div class="funnel-wrapper">
                        <div class="funnel-row">
                            <div class="funnel-label">Inflow</div>
                            <div class="funnel-bar-container"><div id="bar-inflow-2" class="funnel-bar bar-inflow" style="width: 0%"><span id="val-inflow-2">--</span></div></div>
                            <div class="funnel-delta" id="delta-inflow-2"></div>
                        </div>
                        <div class="funnel-row">
                            <div class="funnel-label">Inscope</div>
                            <div class="funnel-bar-container"><div id="bar-inscope-2" class="funnel-bar bar-inscope" style="width: 0%"><span id="val-inscope-2">--</span></div></div>
                            <div class="funnel-delta" id="delta-inscope-2"></div>
                        </div>
                        <div class="funnel-row">
                            <div class="funnel-label">Selected</div>
                            <div class="funnel-bar-container"><div id="bar-selected-2" class="funnel-bar bar-selected" style="width: 0%"><span id="val-selected-2">--</span></div></div>
                            <div class="funnel-delta" id="delta-selected-2"></div>
                        </div>
                        <div class="funnel-row">
                            <div class="funnel-label">Approved</div>
                            <div class="funnel-bar-container"><div id="bar-approved-2" class="funnel-bar bar-approved" style="width: 0%"><span id="val-approved-2">--</span></div></div>
                            <div class="funnel-delta" id="delta-approved-2"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="sidebar">
                <div class="filter-group">
                    <label>Client (Module 2)</label>
                    <select id="filter-client-2"><option value="">Load Data First...</option></select>
                </div>
                <div class="filter-group">
                    <label>Selection Type</label>
                    <select id="filter-sel-2"></select>
                </div>
                <div class="filter-group">
                    <label>Month Run</label>
                    <select id="filter-month-2"></select>
                </div>
            </div>
        </div>
    </div>

    <script>
        let globalData = [];

        // Robust CSV column parser to defeat Databricks alias quirks
        function getNum(row, colName) {
            if (row[colName] !== undefined && typeof row[colName] === 'number') return row[colName];
            const cleanTarget = colName.toLowerCase().replace(/[^a-z_]/g, '');
            const key = Object.keys(row).find(k => k.toLowerCase().replace(/[^a-z_]/g, '').includes(cleanTarget));
            return key ? Number(row[key]) || 0 : 0;
        }

        document.getElementById('csvFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            Papa.parse(file, { header: true, dynamicTyping: true, skipEmptyLines: true, complete: function(results) {
                globalData = results.data;
                initializeFilters('1');
                initializeFilters('2');
            }});
        });

        // Event listeners for modules
        ['1', '2'].forEach(id => {
            document.getElementById(`filter-client-${id}`).addEventListener('change', () => cascadeFilters(id));
            document.getElementById(`filter-sel-${id}`).addEventListener('change', () => cascadeFilters(id));
            document.getElementById(`filter-month-${id}`).addEventListener('change', () => updateDashboard(id));
        });

        function populateDropdown(selectId, options) {
            const select = document.getElementById(selectId);
            select.innerHTML = '';
            options.forEach(opt => {
                select.innerHTML += `<option value="${opt}">${opt}</option>`;
            });
        }

        // Initialize base clients for both modules
        function initializeFilters(moduleId) {
            const clients = [...new Set(globalData.map(d => d.client).filter(Boolean))].sort();
            populateDropdown(`filter-client-${moduleId}`, clients);
            cascadeFilters(moduleId); // Trigger cascade to fill Selection Types
        }

        // Cascading dropdowns: Selection Type and Month Run depend on the chosen Client
        function cascadeFilters(moduleId) {
            const client = document.getElementById(`filter-client-${moduleId}`).value;
            if (!client) return;

            const cData = globalData.filter(d => d.client === client);
            const selTypes = [...new Set(cData.map(d => d.selection_type).filter(Boolean))].sort();
            
            // Retain selection if possible, otherwise default to first
            const selDropdown = document.getElementById(`filter-sel-${moduleId}`);
            const currentSel = selDropdown.value;
            populateDropdown(`filter-sel-${moduleId}`, selTypes);
            if(selTypes.includes(currentSel)) selDropdown.value = currentSel;

            const activeSelType = selDropdown.value;
            const csData = cData.filter(d => d.selection_type === activeSelType);
            const months = [...new Set(csData.map(d => d.month_run).filter(Boolean))].sort((a,b)=>b-a);
            
            const monthDropdown = document.getElementById(`filter-month-${moduleId}`);
            const currentMonth = parseInt(monthDropdown.value);
            populateDropdown(`filter-month-${moduleId}`, months);
            if(months.includes(currentMonth)) monthDropdown.value = currentMonth;

            updateDashboard(moduleId);
        }

        function updateDashboard(moduleId) {
            const client = document.getElementById(`filter-client-${moduleId}`).value;
            const selType = document.getElementById(`filter-sel-${moduleId}`).value;
            const monthRun = parseInt(document.getElementById(`filter-month-${moduleId}`).value);

            if (!client || !selType || !monthRun) return;

            // Update Header
            document.getElementById(`title-${moduleId}`).innerText = `${client} IMPLANTS`;

            // 1. Get ALL data for this specific Client + Selection Type to calculate the "Available Months Average"
            const clientSelData = globalData.filter(d => d.client === client && d.selection_type === selType);
            
            // Determine how many unique months exist for this combo to calculate the average
            const uniqueMonths = [...new Set(clientSelData.map(d => d.month_run))].length;
            const avgDivisor = uniqueMonths > 0 ? uniqueMonths : 1;

            const avgInflow = clientSelData.reduce((sum, row) => sum + getNum(row, 'inflow'), 0) / avgDivisor;
            const avgInscope = clientSelData.reduce((sum, row) => sum + getNum(row, 'inscope'), 0) / avgDivisor;
            const avgSelected = clientSelData.reduce((sum, row) => sum + getNum(row, 'selected'), 0) / avgDivisor;
            const avgApproved = clientSelData.reduce((sum, row) => sum + getNum(row, 'approved'), 0) / avgDivisor;

            // 2. Get data for just the SELECTED current month
            const currentData = clientSelData.filter(d => parseInt(d.month_run) === monthRun);

            const curInflow = currentData.reduce((sum, row) => sum + getNum(row, 'inflow'), 0);
            const curInscope = currentData.reduce((sum, row) => sum + getNum(row, 'inscope'), 0);
            const curSelected = currentData.reduce((sum, row) => sum + getNum(row, 'selected'), 0);
            const curApproved = currentData.reduce((sum, row) => sum + getNum(row, 'approved'), 0);

            // Update UI Numbers
            document.getElementById(`val-inflow-${moduleId}`).innerText = curInflow.toLocaleString();
            document.getElementById(`val-inscope-${moduleId}`).innerText = curInscope.toLocaleString();
            document.getElementById(`val-selected-${moduleId}`).innerText = curSelected.toLocaleString();
            document.getElementById(`val-approved-${moduleId}`).innerText = curApproved.toLocaleString();

            // Update Funnel Bars (Proportional to Inflow)
            const maxVal = curInflow || 1;
            document.getElementById(`bar-inflow-${moduleId}`).style.width = '100%';
            document.getElementById(`bar-inscope-${moduleId}`).style.width = `${Math.min((curInscope/maxVal)*100, 100)}%`;
            document.getElementById(`bar-selected-${moduleId}`).style.width = `${Math.min((curSelected/maxVal)*100, 100)}%`;
            document.getElementById(`bar-approved-${moduleId}`).style.width = `${Math.min((curApproved/maxVal)*100, 100)}%`;

            // Calculate and Render Deltas based on the overall available average
            const renderDelta = (cur, avg, elementId) => {
                if (cur === 0 && (avg === 0 || avg === 1)) { document.getElementById(elementId).innerHTML = ""; return; }
                const diff = ((cur - avg) / avg) * 100;
                const sign = diff >= 0 ? '▲' : '▼';
                const color = diff >= 0 ? 'var(--positive)' : 'var(--negative)';
                document.getElementById(elementId).innerHTML = `<span style="color:${color};">${sign} ${Math.abs(diff).toFixed(1)}%</span>`;
            };

            renderDelta(curInflow, avgInflow, `delta-inflow-${moduleId}`);
            renderDelta(curInscope, avgInscope, `delta-inscope-${moduleId}`);
            renderDelta(curSelected, avgSelected, `delta-selected-${moduleId}`);
            renderDelta(curApproved, avgApproved, `delta-approved-${moduleId}`);
        }
    </script>
</body>
</html>
